version: '3.8'

services:
  # Backend - API Express + SQLite
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: vite-gourmand-server
    ports:
      - "4000:4000"
    volumes:
      # Volume pour persister la base de données
      - ./server/data:/app/data
      # Volume pour le développement (hot reload si nécessaire)
      - ./server/src:/app/src
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - PORT=4000
      - DB_PATH=./data/vite-gourmand.db
    networks:
      - vite-gourmand-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:4000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Frontend - React + Vite
  app:
    build:
      context: ./app
      dockerfile: Dockerfile
      args:
        # Les variables VITE_* doivent être passées au build time
        VITE_API_URL: http://localhost:4000
    container_name: vite-gourmand-app
    ports:
      - "5173:80"
    depends_on:
      - server
    networks:
      - vite-gourmand-network
    restart: unless-stopped

networks:
  vite-gourmand-network:
    driver: bridge

