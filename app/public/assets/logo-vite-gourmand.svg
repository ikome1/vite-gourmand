<svg width="180" height="60" viewBox="0 0 180 60" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Vite &amp; Gourmand Logo</title>
  <desc id="desc">Logo minimaliste rouge et or de Vite et Gourmand</desc>
  <defs>
    <linearGradient id="vgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#BF1E2E" />
      <stop offset="100%" stop-color="#F79F1F" />
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="180" height="60" rx="18" fill="url(#vgGradient)" />
  <text x="32" y="32" font-family="Inter, 'Segoe UI', sans-serif" font-size="20" fill="#ffffff" font-weight="700">
    Vite
  </text>
  <text x="28" y="48" font-family="Inter, 'Segoe UI', sans-serif" font-size="12" fill="#fff7eb" letter-spacing="0.32em">
    &amp; GOURMAND
  </text>
  <circle cx="24" cy="18" r="10" fill="#ffffff" opacity="0.18" />
  <circle cx="150" cy="44" r="8" fill="#ffffff" opacity="0.18" />
</svg>

